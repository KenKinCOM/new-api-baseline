# New-API Docker Compose — production shape.
#
# 本地开发请用 docker-compose.dev.yml（带前端热更新，允许宿主直映射与默认口令）。
# 本文件按 T4 事实表 §4.3「上云前必须改」加固，用于 ECS/ALB 生产形态：
#   * 镜像来自本仓构建并固定 tag/digest，不再使用 calciumion/new-api:latest
#   * 不再映射 3000:3000 到宿主机，只允许 ALB/安全组入站
#   * 无 container_name（可横向扩容到 ≥2 副本）
#   * 无 123456 弱口令；所有口令必须由 .env 显式提供，缺失即启动失败
#   * 密钥走 *_FILE（SESSION_SECRET_FILE / CRYPTO_SECRET_FILE），不落进 inspect 输出
#   * 有 CPU/内存上限与容器日志轮转
#
# 使用前：
#   1. cp deploy/env.production.example .env && 逐项填写（口令用 openssl rand -hex 32 生成）
#   2. mkdir -p secrets && printf '%s' "$(openssl rand -hex 32)" > secrets/session_secret && chmod 400 secrets/session_secret
#   3. docker build -t new-api:$(cat VERSION) . && NEW_API_IMAGE=new-api:$(cat VERSION) docker compose up -d
#   4. 探针：ALB/ECS 健康检查指向 GET /api/readyz（校验 DB），不要用 /api/status

services:
  new-api:
    image: ${NEW_API_IMAGE:?NEW_API_IMAGE must be a locally built tag or digest, not calciumion/new-api:latest}
    restart: always
    command: --log-dir /data/logs
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # 密钥从只读文件读，环境变量里不留值（C-01）
      - SESSION_SECRET_FILE=/run/secrets/session_secret
      - CRYPTO_SECRET_FILE=/run/secrets/crypto_secret
      # 显式声明信任代理，替代默认「回环 + RFC1918」放宽并消除启动告警（C-09）
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:?TRUSTED_PROXIES must be set explicitly (e.g. 172.20.0.0/16 or none)}
      # 日志轮转（C-06）：单文件上限与保留天数由 logger 自身执行
      - LOG_MAX_SIZE_MB=${LOG_MAX_SIZE_MB:-200}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-14}
      # pprof 默认关闭（C-10）；只有排障窗口才临时打开，并在安全组封 8005
      - ENABLE_PPROF=${ENABLE_PPROF:-false}
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=${NODE_NAME:-new-api-node-1}
    volumes:
      - newapi_data:/data
      - ./secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - new-api-network
    # 不映射宿主端口：只经 ALB / 安全组入站。
    # 单机调试确需直连时，只绑回环：ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      # 校验 DB 的 readiness；/api/status 在 DB 挂掉时仍返回 success（T4 §3.3）
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/readyz | grep -q '\"status\":\"ready\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      replicas: ${NEW_API_REPLICAS:-2}
      resources:
        limits:
          cpus: ${NEW_API_CPU_LIMIT:-2}
          memory: ${NEW_API_MEM_LIMIT:-2g}
        reservations:
          memory: ${NEW_API_MEM_RESERVATION:-512m}
      restart_policy:
        condition: on-failure
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-50m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}

  redis:
    image: redis:7.4-alpine
    restart: always
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    networks:
      - new-api-network
    deploy:
      resources:
        limits:
          cpus: ${REDIS_CPU_LIMIT:-1}
          memory: ${REDIS_MEM_LIMIT:-512m}
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-50m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-newapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-new-api}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES_CPU_LIMIT:-2}
          memory: ${POSTGRES_MEM_LIMIT:-2g}
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-50m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}

volumes:
  newapi_data:
  redis_data:
  pg_data:

networks:
  new-api-network:
    driver: bridge
